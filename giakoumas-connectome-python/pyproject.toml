[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giakoumas-connectome-python"
version = "0.2.0"
description = "Standalone notebook and shared-code workflows for the Giakoumas connectome analyses."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=6.1.1",
    "kaleido>=1.2.0",
    "seaborn>=0.13",
    "upsetplot>=0.9",
]

[project.scripts]
giakoumas-connectome = "giakoumas_connectome.cli:main"

[project.license]
text = "MIT"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
